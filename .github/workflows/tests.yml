name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_UI_LANGUAGE: en

jobs:
  windows:
    name: All suites (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: |
            ASLM/Tests/ASLM.Tests.csproj
            ASLM/Patcher/Tests/ASLM.Patcher.Tests.csproj
            ASLM/Launcher/Tests/ASLM.Launcher.Tests.csproj
            ASLM/Installer/Tests/ASLM.Installer.Tests.csproj

      - name: Install MAUI workload
        run: dotnet workload install maui

      - name: ASLM.Tests
        run: dotnet test ASLM/Tests/ASLM.Tests.csproj -c Debug --nologo -v minimal --logger trx --results-directory "${{ runner.temp }}/trx/aslm"

      - name: ASLM.Patcher.Tests
        run: dotnet test ASLM/Patcher/Tests/ASLM.Patcher.Tests.csproj -c Debug --nologo -v minimal --logger trx --results-directory "${{ runner.temp }}/trx/patcher"

      - name: ASLM.Launcher.Tests
        run: dotnet test ASLM/Launcher/Tests/ASLM.Launcher.Tests.csproj -c Debug --nologo -v minimal --logger trx --results-directory "${{ runner.temp }}/trx/launcher"

      - name: ASLM.Installer.Tests
        run: dotnet test ASLM/Installer/Tests/ASLM.Installer.Tests.csproj -c Debug --nologo -v minimal --logger trx --results-directory "${{ runner.temp }}/trx/installer"

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/trx
          if-no-files-found: ignore
